services:
  storage:
    image: python:3.13-alpine
    working_dir: /app
    command: ["python", "-u", "server.py"]
    environment:
      DB_PATH: /data/telemetry.sqlite3
      PORT: "8081"
    ports:
      - "8081:8081"
    volumes:
      - ./server.py:/app/server.py:ro,Z
      - ./index.html:/app/index.html:ro,Z
      - ./inspect_db.py:/app/inspect_db.py:ro,Z
      - ./data:/data:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
